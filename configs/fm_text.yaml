seed: 42

data:
  data_dir: ./data/ATG
  emb_path: ./data/ATG/3large_emb.pickle
  whitening_cache: ./data/processed/whitening_cache.npz
  padding_idx: 11924
  batch_size: 1024
  num_workers: 4
  max_seq_len: 10

model:
  n_components: 256               # PCA размерность латентного пространства
  per_component_whitening: true   # true = Var(E)=I точно (метод авторов); false = глобальный std
  p_uncond: 0.0
  w_cfg: 0.0
  retrieval_metric: cosine        # l2, dot, cosine

encoder:
  d_hidden: 512
  d_cond: 512
  layers: 1
  heads: 4
  d_ff: 2048
  dropout: 0.1

denoiser:
  d_block: 256
  d_ff: 1024
  n_blocks: 3
  time_emb_dim: 128
  dropout: 0.1

optimizer:
  lr: 1e-3
  weight_decay: 0.0
  grad_clip: null
  num_epochs: 500
  warmup_epochs: 0

ema:
  decay: 0

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50   # шагов Euler ODE при сэмплинге

output:
  dir: ./checkpoints
  run_name: fm_text_1
