data:
  data_dir: ./data/ATG
  emb_path: ./data/ATG/3large_emb.pickle
  whitening_cache: ./data/processed/whitening_cache.npz
  padding_idx: 11924
  n_components: 256
  batch_size: 256
  num_workers: 4
  max_seq_len: 10

encoder:
  d_hidden: 512
  d_cond: 512
  layers: 2
  heads: 8
  d_ff: 2048
  dropout: 0.1

denoiser:
  d_block: 256
  d_ff: 1024
  n_blocks: 3
  time_emb_dim: 128
  dropout: 0.1

flow_matching:
  p_uncond: 0.1
  w_cfg: 1.0
  retrieval_metric: cosine                 # 'dot', 'cosine' или 'l2'
  per_component_whitening: true        # true = Var(E)=I точно; false = глобальный std

optimizer:
  lr: 1e-4
  weight_decay: 0.0
  grad_clip: null
  num_epochs: 500
  warmup_epochs: 0

ema:
  decay: 0.9

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50

output:
  dir: ./checkpoints
  run_name: fm_text_cosine_7

reproducibility:
  seed: 42
