seed: 42
model_type: dreamrec_alphafuse

data:
  data_dir: ./data/ATG
  emb_path: ./data/ATG/3large_emb.pickle
  whitening_cache: ./data/processed/whitening_cache.npz
  padding_idx: 11924
  n_items: 11924
  batch_size: 1024
  num_workers: 4
  max_seq_len: 10

model:
  d_emb: 3072           # полный спектр 3large, без усечения
  null_dim: 2500        # = порог AlphaFuse 0.25 (при TEM ×40) на ATG; то же, что null_thres: 1.5625e-4
  null_thres: null
  fusion: replace       # replace — как в статье для DreamRec (разд. 4.1.5); add — Eq. 10 и дефолт кода авторов (cover=False)
  id_init: normal
  n_heads: 1
  d_ff: 3072            # FFN AlphaFuse: скрытый слой = d
  dropout: 0.1
  T: 1000
  beta_schedule: exp # 1e-4 → 0.02
  p_uncond: 0.0
  w_cfg: 0.0
  retrieval_metric: dot # как в AlphaFuse

optimizer:
  name: adamw           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay (при wd 0 одинаковы)
  lr: 1e-4
  weight_decay: 0.0
  grad_clip: 1.0
  num_epochs: 200      # в AlphaFuse — максимум, дальше early stopping (patience 50 проверок)
  warmup_epochs: 0
  ema_decay: null       # null — без EMA; 0.999 — полураспад ≈ 690 шагов (≈12 эпох)

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50  # сетка AlphaFuse 0, 100, …, 2000; у нас ancestral DDPM вместо DDIM

output:
  dir: ./checkpoints
  run_name: dreamrec_alphafuse_3

