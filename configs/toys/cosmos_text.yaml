seed: 42
model_type: dreamrec_cosmos   # сравнение: dreamrec_text — те же данные, энкодер, DDPM и оптимизатор, другой денойзер

data:
  data_dir: ./data/processed/toys
  padding_idx: 20259       # = item_num из data_statis.df
  n_items: 20259
  batch_size: 256          # с train_prefixes строк в батче ≈ ×13 (все префиксы истории)
  num_workers: 4
  max_seq_len: 49          # окно истории; = seq_size из data_statis.df

model:
  items:
    source: text           # learned — обучаемые с нуля; text — из emb_path; sasrec — таблица из чекпойнта SASRec
    emb_path: ./data/processed/toys/qwen3-embedding-0.6b_text.pickle
    use_pca: true
    n_components: 1024
    per_component_whitening: true
    whitening_cache: ./data/processed/toys/whitening_cache.npz   # кэш не проверяет эмбеддинги — свой на каждый источник

  # энкодер истории
  n_heads: 2
  n_layers: 1
  d_ff: 1024
  dropout: 0.1

  # денойзер
  n_blocks: 2
  denoiser_heads: 4
  mlp_mult: 1              # d = 1024: скрытый слой SwiGLU 1024
  denoiser_dropout: 0.0

  T: 1000
  beta_schedule: linear    # exp, linear, cosine
  retrieval_metric: dot    # l2, dot, cosine
  train_prefixes: true     # лосс на каждом префиксе истории за один проход энкодера
  loss: mse

optimizer:
  name: adamw
  lr: 1e-4
  weight_decay: 0.0
  grad_clip: 1.0
  num_epochs: 50
  warmup_epochs: 0
  ema_decay: null

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50

output:
  dir: ./checkpoints/toys
  run_name: cosmos_text
