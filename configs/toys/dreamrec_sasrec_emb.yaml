seed: 42
model_type: dreamrec_text   # та же модель, что dreamrec_text, но эмбеддинги товаров — из обученного SASRec

data:
  data_dir: ./data/processed/toys
  emb_path: ./data/processed/toys/sasrec_d256_item_emb.pickle   # scripts/export_sasrec_embeddings.py из checkpoints/toys/sasrec_d256/best.pt
  whitening_cache: ./data/processed/toys/whitening_cache_sasrec_d256.npz   # свой кэш: кэш не проверяет, по каким эмбеддингам посчитан
  shuffle_embeddings_seed: null   # число — перемешать строки эмбеддингов (абляция); whitening-кэш тот же
  padding_idx: 20259       # = item_num из data_statis.df
  n_items: 20259
  batch_size: 256          # с train_prefixes строк в батче ≈ ×12 (все префиксы истории)
  num_workers: 4
  max_seq_len: 49          # окно истории; = seq_size из data_statis.df

model:
  use_pca: true                 # true — PCA + whitening до n_components
  n_components: 256             # ≤ 256 (d_model SASRec)
  per_component_whitening: false  # false — один глобальный std: геометрия SASRec сохраняется (kNN по последнему
                                  # товару HR@10 0.039, как у сырых); true — Var=I по компонентам раздувает
                                  # шумовые направления, kNN падает до 0.015
  n_heads: 2
  n_layers: 1            # число SASRec-блоков в энкодере истории
  d_ff: 1024
  dropout: 0.1
  T: 1000
  beta_schedule: linear    # exp, linear, cosine
  p_uncond: 0
  w_cfg: 0
  retrieval_metric: dot   # l2, dot, cosine
  train_prefixes: true       # лосс на каждом префиксе истории за один проход энкодера
  loss: mse                  # mse — регрессия DDPM; infonce — x̂_0 против таргета и негативов
  loss_metric: dot        # сходство в infonce: dot, cosine
  neg_ratio: 64
  temperature: 1          # логиты infonce = сходство / temperature

optimizer:
  name: adamw           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay
  lr: 1e-3
  weight_decay: 0.0
  grad_clip: 1.0
  num_epochs: 150
  warmup_epochs: 0
  ema_decay: null       # null — без EMA; иначе оценка и best.pt по усреднённым весам

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50   # шагов DDPM reverse; < T = respaced ancestral sampling

output:
  dir: ./checkpoints/toys
  run_name: dreamrec_sasrec_emb
