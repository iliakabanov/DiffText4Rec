seed: 42

data:
  data_dir: ./data/processed/toys
  emb_path: ./data/processed/toys/sasrec_d256_item_emb.pickle   # scripts/export_sasrec_embeddings.py из checkpoints/toys/sasrec_d256/best.pt
  n_items: 20259           # = item_num из data_statis.df

model:
  d_input: 256             # размерность исходного пространства = столбцов в emb_path
  d_latent: 256            # = d_input — без сжатия

output:
  dir: ./checkpoints/toys
  run_name: item_ae_sasrec
