seed: 42
model_type: dreamrec_alphafuse

data:
  data_dir: ./data/processed/toys
  emb_path: ./data/processed/toys/qwen3-embedding-0.6b_text.pickle
  whitening_cache: ./data/processed/toys/whitening_cache.npz   # кэш не проверяет эмбеддинги — свой на каждый датасет
  padding_idx: 20259       # = item_num из data_statis.df
  n_items: 20259
  batch_size: 256          # с train_prefixes строк в батче ≈ ×12 (все префиксы истории)
  num_workers: 4
  max_seq_len: 49          # окно истории; = seq_size из data_statis.df

model:
  d_emb: 1024           # полный спектр Qwen3-Embedding-0.6B, без усечения
  null_dim: 715         # = порог AlphaFuse 0.25 (при TEM ×40) на toys; то же, что null_thres: 1.5625e-4
  null_thres: null
  fusion: replace       # replace — как в статье для DreamRec (разд. 4.1.5); add — Eq. 10 и дефолт кода авторов (cover=False)
  id_init: normal
  n_heads: 1
  n_layers: 1            # число SASRec-блоков в энкодере истории
  d_ff: 1024            # FFN AlphaFuse: скрытый слой = d
  dropout: 0.1
  T: 1000
  beta_schedule: exp # 1e-4 → 0.02
  p_uncond: 0.0
  w_cfg: 0.0
  retrieval_metric: dot # как в AlphaFuse
  train_prefixes: true  # лосс на каждом префиксе истории за один проход энкодера

optimizer:
  name: adamw           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay (при wd 0 одинаковы)
  lr: 1e-4
  weight_decay: 0.0
  grad_clip: 1.0
  num_epochs: 200      # в AlphaFuse — максимум, дальше early stopping (patience 50 проверок)
  warmup_epochs: 0
  ema_decay: null       # null — без EMA; 0.999 — полураспад ≈ 690 шагов (≈12 эпох)

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50  # сетка AlphaFuse 0, 100, …, 2000; у нас ancestral DDPM вместо DDIM

output:
  dir: ./checkpoints/toys
  run_name: dreamrec_alphafuse_toys

