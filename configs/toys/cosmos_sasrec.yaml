seed: 42
model_type: dreamrec_cosmos   # сравнение: dreamrec_sasrec_emb — те же данные, энкодер, DDPM и оптимизатор, другой денойзер

data:
  data_dir: ./data/processed/toys
  padding_idx: 20259       # = item_num из data_statis.df
  n_items: 20259
  batch_size: 256          # с train_prefixes строк в батче ≈ ×13 (все префиксы истории)
  num_workers: 4
  max_seq_len: 49          # окно истории; = seq_size из data_statis.df

model:
  items:
    source: sasrec         # learned — обучаемые с нуля; text — из emb_path; sasrec — таблица из чекпойнта SASRec
    sasrec_checkpoint: ./checkpoints/toys/sasrec_d256/best.pt
    use_pca: true
    n_components: 256      # ≤ d_model SASRec
    per_component_whitening: false   # true раздувает шумовые направления: HR@10 по последнему товару падает с 0.045 до 0.019
    whitening_cache: ./data/processed/toys/whitening_cache_sasrec_d256.npz   # кэш не проверяет эмбеддинги — свой на каждый источник

  # энкодер истории
  n_heads: 2
  n_layers: 1
  d_ff: 1024
  dropout: 0.1

  # денойзер
  n_blocks: 2
  denoiser_heads: 4
  mlp_mult: 4              # d = 256: скрытый слой SwiGLU 1024
  denoiser_dropout: 0.0

  T: 1000
  beta_schedule: linear    # exp, linear, cosine
  retrieval_metric: dot    # l2, dot, cosine
  train_prefixes: true     # лосс на каждом префиксе истории за один проход энкодера
  loss: mse

optimizer:
  name: adamw
  lr: 1e-3
  weight_decay: 0.0
  grad_clip: 1.0
  num_epochs: 150
  warmup_epochs: 0
  ema_decay: null

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50

output:
  dir: ./checkpoints/toys
  run_name: cosmos_sasrec
