seed: 42
model_type: dreamrec

data:
  data_dir: ./data/processed/toys
  padding_idx: 20259       # = item_num из data_statis.df
  n_items: 20259
  batch_size: 256          # с train_prefixes строк в батче ≈ ×12 (все префиксы истории)
  num_workers: 4
  max_seq_len: 49          # окно истории; = seq_size из data_statis.df

model:
  d_emb: 256
  n_heads: 1
  d_ff: 256
  dropout: 0.1
  T: 1000
  beta_schedule: exp   # exp, linear, cosine
  p_uncond: 0.0
  w_cfg: 0.0
  retrieval_metric: dot   # l2, dot, cosine
  train_prefixes: true    # лосс на каждом префиксе истории за один проход энкодера

optimizer:
  name: adamw           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay
  lr: 1e-3
  weight_decay: 0.00
  grad_clip: 1.0
  num_epochs: 250
  warmup_epochs: 0
  ema_decay: null       # null — без EMA; иначе оценка и best.pt по усреднённым весам

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50  # шагов DDPM reverse; < T = respaced ancestral sampling

output:
  dir: ./checkpoints/toys
  run_name: dreamrec_prefixes
