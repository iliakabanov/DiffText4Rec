seed: 42
model_type: sasrec

data:
  data_dir: ./data/processed/toys
  padding_idx: 20259       # = item_num из data_statis.df
  n_items: 20259
  batch_size: 256
  num_workers: 4
  max_seq_len: 49          # окно истории; = seq_size из data_statis.df, длиннее историй в данных нет

model:
  d_model: 128
  n_heads: 2
  n_layers: 2
  d_ff: 512
  dropout: 0.2
  tie_weights: true
  loss: infonce
  neg_ratio: 64
  temperature: 0.07
  retrieval_metric: cosine   # cosine, dot
  train_prefixes: true    # лосс на каждой позиции истории за один forward

optimizer:
  name: adam           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay
  lr: 1e-3
  weight_decay: 1e-6
  grad_clip: 1.0
  num_epochs: 100
  warmup_epochs: 1
  ema_decay: null       # null — без EMA; 0.999 — полураспад ≈ 690 шагов (≈12 эпох)

eval:
  every_epochs: 1
  top_k: [10, 20]

output:
  dir: ./checkpoints/toys
  run_name: sasrec_posloss_3
