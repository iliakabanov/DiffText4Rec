seed: 42
model_type: dreamrec_cosmos

data:
  data_dir: ./data/processed/synthetic_between   # scripts/make_synthetic.py; M на биссектрисе мод: основной датасет
  padding_idx: 8000        # = item_num из data_statis.df
  n_items: 8000
  batch_size: 256          # с train_prefixes строк в батче ×19 (все префиксы истории)
  num_workers: 4
  max_seq_len: 20          # = seq_size: история val — 20 товаров

model:
  items:                   # та же таблица, что у sasrec_text_between
    source: text
    emb_path: ./data/processed/synthetic_between/item_embeddings.pickle   # сфера радиуса √64 = 8: дисперсия координаты ≈ 1, как у шума
    use_pca: false         # эмбеддинги генератора как есть
    n_components: 64       # при use_pca: false не используются, но поля обязательны
    per_component_whitening: false
    whitening_cache: ./data/processed/synthetic_between/whitening_unused.npz

  # энкодер истории
  n_heads: 2
  n_layers: 1
  d_ff: 256
  dropout: 0.1

  # денойзер
  n_blocks: 2
  denoiser_heads: 4
  mlp_mult: 4              # d = 64: скрытый слой SwiGLU 256
  denoiser_dropout: 0.0

  T: 1000
  beta_schedule: linear
  retrieval_metric: dot    # нормы товаров равны: dot, cosine и L2 ранжируют одинаково
  train_prefixes: true
  target_window: 1
  loss: mse

optimizer:
  name: adamw
  lr: 1e-4
  weight_decay: 0.0
  grad_clip: 1.0
  num_epochs: 200          # 78 шагов на эпоху: 15 600 шагов за обучение
  warmup_epochs: 0
  ema_decay: null

eval:
  every_epochs: 20
  top_k: [50]
  item_groups: true        # HR и Recall по старым и новым товарам и NewShare@50
  select_metric: Recall@50_new   # отчитываемся по latest.pt
  num_sample_steps: 50
  neighbors_per_sample: 5  # S: @50 — 10 сэмплов, по 5 мест на сэмпл
  exclude_seen: true       # ответы синтетики не пересекаются с историей по построению

output:
  dir: ./checkpoints/synthetic
  run_name: cosmos_between
