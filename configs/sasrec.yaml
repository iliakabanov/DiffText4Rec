data:
  data_dir: ../data/ATG
  padding_idx: 11924
  n_items: 11924
  batch_size: 256
  num_workers: 4
  max_seq_len: 10

model:
  d_model: 128
  n_heads: 4
  n_layers: 1
  d_ff: 512
  dropout: 0.2
  tie_weights: true
  loss: infonce
  neg_ratio: 64
  temperature: 0.07

optimizer:
  lr: 1e-3
  weight_decay: 1e-6
  grad_clip: 1.0
  num_epochs: 500
  warmup_epochs: 2

ema:
  decay: 0.0

eval:
  every_epochs: 5
  top_k: [10, 20]

output:
  dir: ./checkpoints
  run_name: sasrec_1
