seed: 42
model_type: sasrec

data:
  data_dir: ./data/ATG
  padding_idx: 11924
  n_items: 11924
  batch_size: 256
  num_workers: 4
  max_seq_len: 10

model:
  d_model: 128
  n_heads: 1
  n_layers: 1
  d_ff: 128
  dropout: 0.1
  tie_weights: true
  loss: infonce
  neg_ratio: 64
  temperature: 0.07
  retrieval_metric: dot   # cosine, dot

optimizer:
  name: adam           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay
  lr: 1e-3
  weight_decay: 1e-6
  grad_clip: 1.0
  num_epochs: 100
  warmup_epochs: 1
  ema_decay: null       # null — без EMA; 0.999 — полураспад ≈ 690 шагов (≈12 эпох)

eval:
  every_epochs: 10
  top_k: [10, 20]

output:
  dir: ./checkpoints
  run_name: sasrec
