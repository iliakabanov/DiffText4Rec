seed: 42
model_type: dreamrec_fm_text

data:
  data_dir: ./data/ATG
  emb_path: ./data/ATG/3large_emb.pickle
  whitening_cache: ./data/processed/whitening_cache.npz
  padding_idx: 11924
  n_items: 11924
  batch_size: 1024
  num_workers: 4
  max_seq_len: 10

model:
  use_pca: true                    # false = raw 3072d TEM (медленнее), true = PCA n_components
  n_components: 3072                # игнорируется если use_pca: false
  per_component_whitening: True   # true = Var(E)=I точно (метод авторов); false = глобальный std
  n_heads: 4
  d_ff: 1024
  dropout: 0.1
  prediction: x1       # velocity — сеть предсказывает z_1 − z_0; x1 — сам эмбеддинг товара z_1
  p_uncond: 0.0
  w_cfg: 0.0
  retrieval_metric: cosine   # l2, dot, cosine

optimizer:
  name: adamw           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay
  lr: 1e-4
  weight_decay: 0.0
  grad_clip: 1.0
  num_epochs: 150
  warmup_epochs: 0
  ema_decay: null       # null — без EMA; иначе оценка и best.pt по усреднённым весам

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50   # число шагов Euler ODE при сэмплинге

output:
  dir: ./checkpoints/atg
  run_name: dreamrec_fm_text
