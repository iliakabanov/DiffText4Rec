seed: 1
model_type: sasrec

data:
  data_dir: ./data/ATG
  padding_idx: 11924
  n_items: 11924
  batch_size: 256
  num_workers: 4
  max_seq_len: 10

model:
  d_model: 3072
  n_heads: 1
  n_layers: 1
  d_ff: 128
  dropout: 0.1
  tie_weights: true
  loss: infonce
  neg_ratio: 64
  temperature: 0.07
  loss_metric: cosine     # сходство в лоссе: cosine, dot
  retrieval_metric: cosine   # cosine, dot
  train_prefixes: false    # лосс на каждой позиции истории за один forward
  freeze_items: true       # эмбеддинги товаров остаются случайными N(0, 0.02), не обучаются

optimizer:
  name: adam           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay
  lr: 1e-4
  weight_decay: 1e-6
  grad_clip: 1.0
  num_epochs: 200
  warmup_epochs: 1
  ema_decay: null       # null — без EMA; 0.999 — полураспад ≈ 690 шагов (≈12 эпох)

eval:
  every_epochs: 10
  top_k: [10, 20]

output:
  dir: ./checkpoints/atg
  run_name: sasrec_infonce_d512_frozen


