seed: 1
model_type: dreamrec

data:
  data_dir: ./data/ATG
  padding_idx: 11924
  n_items: 11924
  batch_size: 1024
  num_workers: 4
  max_seq_len: 10

model:
  d_emb: 3072
  n_heads: 1
  n_layers: 1            # число SASRec-блоков в энкодере истории
  d_ff: 128
  dropout: 0.1
  T: 1000
  beta_schedule: exp   # exp, linear, cosine
  p_uncond: 0.0
  w_cfg: 0.0
  retrieval_metric: dot   # l2, dot, cosine
  freeze_items: false      # эмбеддинги товаров остаются случайными N(0, 1), не обучаются

optimizer:
  name: adamw           # adam — weight_decay как L2 в градиенте; adamw — развязанный decay
  lr: 1e-3
  weight_decay: 0.00
  grad_clip: 1.0
  num_epochs: 250
  warmup_epochs: 0
  ema_decay: null       # null — без EMA; иначе оценка и best.pt по усреднённым весам

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50  # шагов DDPM reverse; < T = respaced ancestral sampling

output:
  dir: ./checkpoints/atg
  run_name: dreamrec_d3072
