seed: 42

data:
  data_dir: ./data/ATG
  padding_idx: 11924
  n_items: 11924
  batch_size: 1024
  num_workers: 4
  max_seq_len: 10

model:
  d_model: 3072
  n_heads: 1
  d_ff: 256
  dropout: 0.1
  T: 1000
  beta_schedule: exp   # exp, linear, cosine
  p_uncond: 0.0
  w_cfg: 0.0
  retrieval_metric: cosine   # l2, dot, cosine

optimizer:
  lr: 1e-4
  weight_decay: 0.00
  grad_clip: 1.0
  num_epochs: 150
  warmup_epochs: 0

ema:
  decay: 0

eval:
  every_epochs: 10
  top_k: [10, 20]
  num_sample_steps: 50  # шагов DDPM reverse; < T = respaced ancestral sampling

output:
  dir: ./checkpoints
  run_name: dreamrec_1
