seed: 42

data:
  data_dir: ./data/ATG
  padding_idx: 11924
  n_items: 11924
  batch_size: 1024
  num_workers: 4
  max_seq_len: 10

model:
  d_model: 64
  n_heads: 1
  d_ff: 256
  dropout: 0.1
  T: 1000
  beta_schedule: exp   # exp, linear, cosine
  p_uncond: 0.1
  w_cfg: 2.0
  retrieval_metric: l2   # l2, dot, cosine

optimizer:
  lr: 1e-3
  weight_decay: 0.01
  grad_clip: 1.0
  num_epochs: 300
  warmup_epochs: 0

ema:
  decay: 0

eval:
  every_epochs: 10
  top_k: [10, 20]

output:
  dir: ./checkpoints
  run_name: dreamrec_baseline
